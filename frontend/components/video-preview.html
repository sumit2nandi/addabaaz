<div aria-hidden="true" class="card-preview" id="cardPreview">
<div class="card-preview-video"></div>
<button class="card-preview-sound-btn" data-copy-aria-label="video-preview.cardPreviewSoundBtn.aria-label" data-copy-title="video-preview.cardPreviewSoundBtn.title" id="cardPreviewSoundBtn" onclick="toggleCardPreviewSound(event)" type="button">
<svg aria-hidden="true" id="cardPreviewSoundIcon" viewbox="0 0 24 24"></svg>
</button>
<div class="card-preview-info">
<div class="card-preview-title"></div>
<div class="card-preview-meta"></div>
<div class="card-preview-actions">
<button class="btn btn-primary card-preview-play" type="button"><span class="play-glyph" data-copy="video-preview.play-glyph.text"></span><span data-copy="video-preview.btn-btn-primary-card-preview-play.text"></span></button>
<button class="btn btn-ghost card-preview-details" data-copy="video-preview.btn-btn-ghost-card-preview-details.text" type="button"></button>
</div>
</div>
</div>

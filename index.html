<!-- ADDABAAZ public site: one HTML page; the JavaScript router (app/js) draws every screen into <main id="view">.
     The server fills the two "seo" placeholders below per URL (title, description, structured data, and a plain-HTML copy
     of the page) so search engines and link previews see real content. Static hosts just serve this file as it is. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Keep displayed email addresses as text; explicit mailto links still work. -->
<meta name="format-detection" content="email=no">
<!-- Default search/social tags; the server replaces everything between the seo:head markers for each page. -->
<!--seo:head-->
<title>ADDABAAZ — Bengali Originals, Comedy &amp; Web Series</title>

<meta property="og:type" content="website">
<meta property="og:site_name" content="ADDABAAZ">
<meta property="og:title" content="ADDABAAZ — Bengali Originals, Comedy & Web Series">
<meta property="og:description" content="Shahid, Laugh Bite, Faltu Kotha and more — watch free on ADDABAAZ.">

<!-- App-like behaviour: colours, install manifest and icons (home-screen "Add to Home screen" support). -->
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="media/icons/icon-192.png">
<link rel="apple-touch-icon" href="media/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ADDABAAZ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Web fonts (Latin + Bengali). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Early DNS/TLS for the video hosts: on mobile networks this shaves several hundred ms off the first playback start. -->
<link rel="preconnect" href="https://www.youtube.com">
<link rel="dns-prefetch" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="dns-prefetch" href="https://i.ytimg.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<!-- Font Awesome is used ONLY for social brand glyphs on the Contact page -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app/css/styles.css">

<!-- Deployment settings (API address etc.) — a separate file so it can be changed without touching the app. -->
<script src="app/env.js"></script>
<!-- Pull-to-refresh reload flag (fallback path only — a normal pull refreshes in place, no reload):
     swaps the launch splash for the compact loader before first paint. -->
<script src="app/refresh-flag.js"></script>
<!-- Platform before first paint, so a native launch never flashes the compact web loader first. -->
<script src="app/launch-platform.js"></script>
</head>
<body>
<!-- Accessibility: keyboard users can jump past the menu. -->
<a class="skip-link" href="#view">Skip to Content</a>
<div id="offlineBar" class="offline-bar" hidden role="status">You’re offline — showing saved content.</div>
<!-- Empty containers below are filled by app/js/ui/shell.js: top bar, footer and mobile tab bar. -->
<header class="topbar" id="topbar"></header>
<main id="view" tabindex="-1">
  <!-- The web loader remains compact. Capacitor swaps to the full native-style launch screen until the first route is ready. -->
  <div id="boot" class="boot">
    <div class="boot-web" aria-hidden="true"><div class="boot-mark"><img src="media/icons/icon-192.png" width="88" height="88" alt=""><span class="boot-ring"><svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="54"></circle><circle class="arc" cx="50" cy="50" r="54"></circle></svg></span></div></div>
    <div class="boot-native" role="status" aria-live="polite" aria-busy="true">
      <div class="boot-native-content">
        <!-- The launch screen shows only the brand logo (its badge already carries the name + tagline). -->
        <img class="boot-native-logo" src="media/icons/icon-512.png" width="512" height="512" alt="ADDABAAZ">
        <div class="boot-native-progress" role="progressbar" aria-label="Loading ADDABAAZ"><span></span></div>
      </div>
    </div>
  </div>

</main>

</footer>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="announcer" class="sr-only" aria-live="polite"></div>

<!-- App entry point. -->
<script type="module" src="app/js/main.js"></script>
</body>
</html>

name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate:catalog
      - run: for f in $(find admin app -name '*.js'); do node --check "$f" || exit 1; done   # the browser code has no build step
      - run: node --test test/frontend/app-modules.test.mjs test/frontend/player-logic.test.mjs test/frontend/watch-autoplay.test.mjs   # stale-index deploy guard + player/autoplay behaviour
      # TEMPORARY: surface failing test details as annotations (CI logs are unreachable from the sandbox)
      - run: set -o pipefail; npm test | tee /tmp/t.log || { grep -A8 '^not ok' /tmp/t.log | head -160 | sed 's/^/::error::/' ; exit 1; }
      - run: npm run build:www

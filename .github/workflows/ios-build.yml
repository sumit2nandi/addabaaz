name: iOS simulator app

on:
  workflow_dispatch:
  push:
    paths:
      - 'iOS/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'components/**'
      - 'data/website.xlsx'
      - 'images/**'
      - 'UpcomingReleases/**'
      - 'BTS/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: iOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: iOS/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check Xcode
        run: |
          xcodebuild -version
          python3 -c 'import subprocess; v=subprocess.check_output(["xcodebuild","-version"],text=True).split()[1]; assert int(v.split(".")[0]) >= 26, "Capacitor 8 requires Xcode 26+"'
      - run: npm ci
      - name: Browser checks on WebKit
        run: |
          npx playwright install webkit
          npm run test:webkit
      - name: Build unsigned simulator app
        run: npm run simulator
      - name: Package simulator artifact
        run: ditto -c -k --sequesterRsrc --keepParent build/simulator/Build/Products/Debug-iphonesimulator/App.app build/ADDABAAZ-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: addabaaz-ios-simulator
          path: iOS/build/ADDABAAZ-simulator.zip
          if-no-files-found: error
          retention-days: 14

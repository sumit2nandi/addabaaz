# Site + API + MySQL:   cp .env.example .env  (edit secrets)  &&  docker compose up --build
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: addabaaz
      MYSQL_USER: addabaaz
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    volumes:
      - uploads:/app/uploads      # images uploaded from the admin console
      - backups:/app/backups      # `docker compose exec app npm run backup` writes here (copy them off the machine!)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: addabaaz
      DB_USER: addabaaz
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TRUST_PROXY: ${TRUST_PROXY:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-UCdG8idFz3zA7xOaca8H6qtw}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      CONTACT_WEBHOOK_URL: ${CONTACT_WEBHOOK_URL:-}
      UPLOAD_DIR: /app/uploads
      IMAGE_ALLOWED_HOSTS: ${IMAGE_ALLOWED_HOSTS:-}
      DISABLE_COMPRESSION: ${DISABLE_COMPRESSION:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ALLOW_MOCK_PAYMENTS: ${ALLOW_MOCK_PAYMENTS:-}
      GSTIN: ${GSTIN:-}
      GST_LEGAL_NAME: ${GST_LEGAL_NAME:-ADDABAAZ}
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-}
      BUSINESS_STATE: ${BUSINESS_STATE:-}
      GST_SAC: ${GST_SAC:-998439}
      GST_RATE: ${GST_RATE:-18}
      INVOICE_PREFIX: ${INVOICE_PREFIX:-AB}
      INVOICE_FOOTER: ${INVOICE_FOOTER:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-ADDABAAZ <no-reply@localhost>}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://addabaaz.in}
      EXPIRY_REMINDER_DAYS: ${EXPIRY_REMINDER_DAYS:-3}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_CLIENT_TOKEN: ${FACEBOOK_CLIENT_TOKEN:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      GOOGLE_EXTRA_CLIENT_IDS: ${GOOGLE_EXTRA_CLIENT_IDS:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_SERVICE_ID: ${APPLE_SERVICE_ID:-}
      STREAM_URL_TTL: ${STREAM_URL_TTL:-}
      STREAM_LIMIT: ${STREAM_LIMIT:-2}
      REFUND_WINDOW_DAYS: ${REFUND_WINDOW_DAYS:-7}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
      ALLOW_INDEXING: ${ALLOW_INDEXING:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      BACKUP_DIR: /app/backups
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:-}
      BACKUP_R2_ACCOUNT_ID: ${BACKUP_R2_ACCOUNT_ID:-}
      BACKUP_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:-}
      BACKUP_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:-}
      BACKUP_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
volumes:
  db-data:
  uploads:
  backups:

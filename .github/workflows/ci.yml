name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run validate:catalog
      - run: for f in $(find admin app -name '*.js'); do node --check "$f" || exit 1; done   # the browser code has no build step
      - run: set -o pipefail; npm test 2>&1 | tee /tmp/t.log
      # TEMPORARY (CI logs are unreachable from the sandbox): on failure, publish the first failing TAP
      # block as ONE annotation (GitHub truncates the list of annotations, so a single line carries all
      # of it) and the full log as an artifact (`gh run download <run> -n test-log`).
      - if: failure()
        run: awk '/^not ok/{f=1} f{print; if (/^  \.\.\.$/) exit}' /tmp/t.log | head -150 | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error::/' || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: test-log, path: /tmp/t.log, retention-days: 5, if-no-files-found: ignore }
      - run: npm run build:www
      - run: docker build --tag addabaaz:ci .
      - run: docker run --rm addabaaz:ci node --input-type=module -e "import('./server/src/web-assets.js').then(m => m.prepareWebAssets()).then(r => console.log('[web] Docker minification OK:', r.files, 'files')).catch(e => { console.error(e); process.exitCode = 1; })"

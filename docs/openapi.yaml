openapi: 3.0.3
info:
  title: ADDABAAZ API
  version: 2.0.0
  description: |
    Backend for the ADDABAAZ web and mobile apps. Base path `/api/v1`.
    Auth is a bearer JWT (`Authorization: Bearer <token>`) returned by signup/login.
    Errors are `{ "error": { "code": "...", "message": "..." } }`. Write endpoints return `204` unless noted.
servers:
  - url: http://localhost:3000/api/v1
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    admin: { type: http, scheme: bearer, description: 'An administrator account’s session token (users.is_admin; valid 12h after sign-in), or the optional ADMIN_TOKEN environment variable (24+ characters) for scripts' }
  schemas:
    Error:
      type: object
      properties: { error: { type: object, properties: { code: { type: string }, message: { type: string } } } }
    User: { type: object, properties: { id: { type: string }, name: { type: string }, email: { type: string } } }
    Profile: { type: object, properties: { id: { type: string }, name: { type: string }, color: { type: integer } } }
    Auth:
      type: object
      properties: { token: { type: string }, user: { $ref: '#/components/schemas/User' }, profiles: { type: array, items: { $ref: '#/components/schemas/Profile' } } }
    Library:
      type: object
      properties:
        list: { type: array, items: { type: object, properties: { type: { type: string, enum: [show, video, upcoming] }, id: { type: string }, addedAt: { type: string, format: date-time } } } }
        progress: { type: object, additionalProperties: { type: object, properties: { position: { type: number }, duration: { type: number }, updatedAt: { type: string, format: date-time } } } }
        reminders: { type: array, items: { type: object } }
  parameters:
    pid: { name: pid, in: path, required: true, schema: { type: string } }
  responses:
    NoContent: { description: Done }
    Unauthorized: { description: Missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
security: [ { bearer: [] } ]
paths:
  /health: { get: { security: [], summary: 'Liveness + service discovery (used by the app to detect API mode). Body includes db: up|down.', responses: { '200': { description: OK } } } }
  /health/ready: { get: { security: [], summary: 'Readiness probe — 503 when MySQL is unreachable.', responses: { '200': { description: Ready }, '503': { description: Database down } } } }
  /studio: { get: { security: [], summary: 'About / team / services / contact details (edited in the admin console)', responses: { '200': { description: studio.json } } } }
  /catalog: { get: { security: [], summary: Full catalog (shows, videos, upcoming, gallery), responses: { '200': { description: catalog.json } } } }
  /plans: { get: { security: [], summary: 'Plans plus the active payment provider', responses: { '200': { description: '{ plans: [...], payments: { provider: razorpay|mock|none, keyId? }, billing: { gst: bool, coupons: bool, states: [{code,name}] } }' } } } }
  /auth/signup:
    post:
      security: []
      summary: Create account (+ first profile). Password 8–128 chars.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, email, password], properties: { name: { type: string }, email: { type: string }, password: { type: string } } } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Auth' } } } }, '409': { description: email_taken }, '429': { description: Rate limited } }
  /auth/login:
    post:
      security: []
      summary: Sign in
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Auth' } } } }, '401': { description: invalid_credentials } }
  /auth/providers: { get: { security: [], summary: 'Which sign-in methods are enabled, with public client ids for the web/native SDKs.', responses: { '200': { description: '{ password, google?, facebook? }' } } } }
  /auth/google:
    post:
      security: []
      summary: Sign in / sign up with a Google ID token (verified server-side). Links to an existing account with the same verified email.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [idToken], properties: { idToken: { type: string } } } } } }
      responses: { '200': { description: 'Auth + isNew flag' }, '400': { description: email_required / email_unverified }, '401': { description: invalid_credential }, '501': { description: provider_not_configured }, '503': { description: provider_unavailable } }
  /auth/facebook:
    post:
      security: []
      summary: Sign in / sign up with a Facebook user access token (verified via debug_token, must belong to this app).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [accessToken], properties: { accessToken: { type: string } } } } } }
      responses: { '200': { description: 'Auth + isNew flag' }, '400': { description: email_required / email_unverified }, '401': { description: invalid_credential }, '501': { description: provider_not_configured }, '503': { description: provider_unavailable } }
  /videos/{id}/stream:
    post:
      security: [ {}, { bearer: [] } ]
      summary: 'Playable URL for a video stored in Cloudflare R2. Premium videos need a signed-in user (Bearer); free ones are public.'
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: '{ type: mp4|hls, url, expiresAt }', content: { application/json: { schema: { type: object, properties: { type: { type: string, enum: [mp4, hls] }, url: { type: string }, expiresAt: { type: string, format: date-time } } } } } }
        '400': { description: not_hosted (video isn't an R2 source) }
        '401': { description: login_required }
        '402': { description: subscription_required (signed in, but no active paid plan) }
        '404': { description: unknown video }
        '503': { description: storage_not_configured }
  /media/{token}/{path}:
    get:
      security: []
      summary: 'HLS gateway. `token` comes from /videos/{id}/stream. Playlists (.m3u8) are proxied; everything else is a 302 to a 15-minute presigned R2 URL.'
      parameters: [ { name: token, in: path, required: true, schema: { type: string } }, { name: path, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: playlist }, '302': { description: redirect to R2 }, '401': { description: expired/invalid token }, '404': { description: not found } }
  /contact:
    post:
      security: []
      summary: Contact form. Honeypot field `website` must be empty. 5 requests / 10 min / IP.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, email, message], properties: { name: { type: string }, email: { type: string }, message: { type: string }, website: { type: string } } } } } }
      responses: { '202': { description: Accepted } }
  /me:
    get: { summary: Current user, profiles and subscription, responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } } }
    patch: { summary: Rename user, responses: { '200': { description: OK } } }
    delete: { summary: Permanently delete the account and all its data (App Store 5.1.1(v)), responses: { '204': { $ref: '#/components/responses/NoContent' } } }
  /profiles:
    get: { summary: List profiles, responses: { '200': { description: OK } } }
    post: { summary: Create profile (max 5), responses: { '201': { description: Created }, '409': { description: profile_limit } } }
  /profiles/{pid}:
    parameters: [ { $ref: '#/components/parameters/pid' } ]
    patch: { summary: Update name/colour, responses: { '200': { description: OK } } }
    delete: { summary: Delete profile (not the last one), responses: { '204': { $ref: '#/components/responses/NoContent' }, '409': { description: last_profile } } }
  /profiles/{pid}/library:
    parameters: [ { $ref: '#/components/parameters/pid' } ]
    get: { summary: My List, watch progress and reminders, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Library' } } } } } }
  /profiles/{pid}/list/{type}/{id}:
    parameters:
      - { $ref: '#/components/parameters/pid' }
      - { name: type, in: path, required: true, schema: { type: string, enum: [show, video, upcoming] } }
      - { name: id, in: path, required: true, schema: { type: string } }
    put: { summary: Add to My List (idempotent), responses: { '204': { $ref: '#/components/responses/NoContent' }, '404': { description: not_found } } }
    delete: { summary: Remove from My List, responses: { '204': { $ref: '#/components/responses/NoContent' } } }
  /profiles/{pid}/progress/{videoId}:
    parameters: [ { $ref: '#/components/parameters/pid' }, { name: videoId, in: path, required: true, schema: { type: string } } ]
    put:
      summary: Save playback position (keeps the 500 most recent)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [position, duration], properties: { position: { type: number }, duration: { type: number } } } } } }
      responses: { '204': { $ref: '#/components/responses/NoContent' } }
    delete: { summary: Remove from Continue Watching, responses: { '204': { $ref: '#/components/responses/NoContent' } } }
  /profiles/{pid}/reminders/{id}:
    parameters: [ { $ref: '#/components/parameters/pid' }, { name: id, in: path, required: true, schema: { type: string } } ]
    put: { summary: Set a reminder for an upcoming title, responses: { '204': { $ref: '#/components/responses/NoContent' } } }
    delete: { summary: Remove reminder, responses: { '204': { $ref: '#/components/responses/NoContent' } } }
  /subscription:
    get: { summary: Current subscription, responses: { '200': { description: OK } } }
    delete: { summary: 'End a DEMO plan. Real plans are prepaid and cannot be cancelled here (409 not_cancellable).', responses: { '200': { description: '{ subscription }' }, '409': { description: not_cancellable } } }
  /payments/checkout:
    post:
      summary: 'Start a purchase. razorpay → creates an order (returns keyId, orderId, amount, currency, prefill) for Razorpay Checkout; mock (dev only) → activates instantly; none → 501.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [planId], properties: { planId: { type: string, enum: [plus-monthly, plus-yearly] }, couponCode: { type: string }, billing: { type: object, description: 'Required when GST invoicing is on: state (name or 2-digit code) or a valid gstin + name', properties: { state: { type: string }, gstin: { type: string }, name: { type: string } } } } } } } }
      responses: { '201': { description: 'razorpay: order for Checkout · coupon: free grant · mock: demo activation (all include quote/subscription)' }, '400': { description: 'unknown_plan | invalid_coupon | billing_state_required | invalid_gstin | business_name_required' }, '501': { description: payments_not_configured }, '502': { description: provider_error } }
  /payments/quote:
    post:
      summary: 'Price preview with a coupon (Razorpay provider only).'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [planId], properties: { planId: { type: string }, couponCode: { type: string } } } } } }
      responses: { '200': { description: '{ quote: { planId, listPaise, discountPaise, finalPaise, coupon } }' }, '400': { description: invalid_coupon (message says why) }, '501': { description: payments_not_configured } }
  /billing:
    get: { summary: 'Paid plans with their invoice, credit notes and refund status', responses: { '200': { description: '{ payments: [...] }' } } }
  /invoices/{id}/pdf:
    get:
      summary: 'Download a GST invoice or credit note (owner only)'
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }, '404': { description: not found } }
  /invoices/{id}/email:
    post:
      summary: 'Email the invoice PDF to the account address'
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { $ref: '#/components/responses/NoContent' }, '404': { description: not found } }
  /payments/verify:
    post:
      summary: 'Report a finished Razorpay payment. The HMAC signature is verified with the key secret; the plan is activated once (idempotent). The order must belong to the caller.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [orderId, paymentId, signature], properties: { orderId: { type: string }, paymentId: { type: string }, signature: { type: string } } } } } }
      responses: { '200': { description: '{ subscription }' }, '400': { description: invalid_signature }, '404': { description: unknown order }, '501': { description: payments_not_configured } }
  /payments/webhook:
    post:
      security: []
      summary: 'Razorpay → API. Signed with RAZORPAY_WEBHOOK_SECRET over the raw body (X-Razorpay-Signature). Handles payment.captured / order.paid (activates the plan + issues the invoice, even if the buyer never returned), payment.failed, and refund.created / processed / failed.'
      responses: { '200': { description: ok }, '400': { description: invalid_signature } }
  /admin/payments:
    get: { summary: 'Admin (Bearer ADMIN_TOKEN): recent payments, ?email=&limit=', security: [ { admin: [] } ], responses: { '200': { description: '{ payments }' }, '401': { description: unauthorized }, '403': { description: not an administrator } } }
  /admin/payments/{id}/refund:
    post:
      summary: 'Admin: refund a Razorpay payment (fully or partly). Issues a credit note once processed; a full refund ends the access.'
      security: [ { admin: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { amountPaise: { type: integer, minimum: 100 }, reason: { type: string }, revokeAccess: { type: boolean } } } } } }
      responses: { '201': { description: '{ refund, creditNote, accessRevoked }' }, '409': { description: not_refundable | refund_exceeds_payment }, '502': { description: provider_error } }
  /admin/coupons:
    get: { summary: 'Admin: list coupons with redemption counts', security: [ { admin: [] } ], responses: { '200': { description: '{ coupons }' } } }
    post:
      summary: 'Admin: create a coupon'
      security: [ { admin: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code, kind, value], properties: { code: { type: string }, kind: { type: string, enum: [percent, flat] }, value: { type: integer, description: 'percent 1-100, or paise' }, description: { type: string }, planIds: { type: array, items: { type: string } }, maxRedemptions: { type: integer }, perUserLimit: { type: integer, default: 1 }, startsAt: { type: string, format: date-time }, expiresAt: { type: string, format: date-time } } } } } }
      responses: { '201': { description: '{ coupon }' }, '400': { description: validation }, '409': { description: exists } }
  /admin/coupons/{code}:
    patch: { summary: 'Admin: change active / dates / limits / description', security: [ { admin: [] } ], parameters: [ { name: code, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: '{ coupon }' }, '404': { description: unknown } } }
  /admin/invoices.csv:
    get: { summary: 'Admin: sales register CSV (invoices +, credit notes -), ?from=YYYY-MM-DD&to=YYYY-MM-DD in IST', security: [ { admin: [] } ], responses: { '200': { description: text/csv } } }
  /admin/invoices/{id}/pdf:
    get: { summary: 'Admin: any invoice as PDF', security: [ { admin: [] } ], parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: PDF } } }
  /admin/session:
    get: { summary: 'Admin: who am I (also proves the session is an admin one)', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator } } }
  /admin/stats:
    get: { summary: 'Admin: dashboard numbers (revenue, subscribers, sign-ups, recent activity)', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator } } }
  /admin/health:
    get: { summary: 'Admin: setup checklist (GSTIN, SMTP, R2, Razorpay, secrets…)', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator } } }
  /admin/users:
    get: { summary: 'Admin: users, ?q=&filter=all|paid|free|expiring|expired|admin|disabled&limit=&offset=', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator } } }
  /admin/users/{id}:
    get: { summary: 'Admin: one user with profiles, subscription and payments', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator }, '404': { description: unknown user } } }
    patch: { summary: 'Admin: change name / isAdmin / disabled (cannot lock yourself out or remove the last admin)', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator }, '409': { description: cannot_lock_yourself_out | last_admin } } }
    delete: { summary: 'Admin: delete a user (payment and invoice records are kept)', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator }, '409': { description: cannot_lock_yourself_out | last_admin } } }
  /admin/users/{id}/grant:
    post: { summary: 'Admin: give free access { days, planId?, note? } — no payment or invoice', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator } } }
  /admin/users/{id}/revoke-plan:
    post: { summary: 'Admin: end the current plan now (does not refund)', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator } } }
  /admin/messages:
    get: { summary: 'Admin: contact messages, ?status=open|handled|all', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator } } }
  /admin/messages/{id}:
    patch: { summary: 'Admin: mark handled / reopen { handled }', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator } } }
    delete: { summary: 'Admin: delete a message', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator } } }
  /admin/audit:
    get: { summary: 'Admin: audit log, newest first, ?action=&before=<id>&limit=', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator } } }
  /admin/catalog:
    get: { summary: 'Admin: the whole catalog including the studio profile', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator } } }
  /admin/catalog/{type}:
    post: { summary: 'Admin: add an item; type = shows|videos|upcoming|gallery. Validated like `npm run validate:catalog`', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator }, '400': { description: validation }, '409': { description: exists } } }
  /admin/catalog/{type}/order:
    put: { summary: 'Admin: set display order { ids: [...] }', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator } } }
  /admin/catalog/{type}/{id}:
    put: { summary: 'Admin: replace an item', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator }, '404': { description: unknown } } }
    delete: { summary: 'Admin: delete an item (shows: ?cascade=1 also deletes their videos)', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator }, '409': { description: has_videos } } }
  /admin/studio:
    put: { summary: 'Admin: replace the studio profile (About / Services / Contact)', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator }, '400': { description: validation } } }
  /admin/uploads/image:
    post: { summary: 'Admin: upload an image (raw body, png/jpeg/webp/gif, ≤ 4 MB) → { path: uploads/<hash>.<ext> }', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator }, '413': { description: too large }, '400': { description: unsupported_image } } }
  /admin/uploads/video:
    post: { summary: 'Admin: presigned PUT URL for a premium video in R2 { filename, slug } → { key, uploadUrl, expiresInSeconds }', security: [ { admin: [] } ], responses: { '200': { description: ok }, '401': { description: unauthorized / admin_session_expired }, '403': { description: not an administrator }, '503': { description: storage_not_configured } } }

server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: addabaaz-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/addabaaz?stringtype=unspecified}
    username: ${DB_USERNAME:addabaaz}
    password: ${DB_PASSWORD:addabaaz_dev_password}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by db/postgresql/V1__schema.sql — Hibernate never touches it.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:replace-with-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:replace-with-google-client-secret}
            scope: openid, profile, email
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'

addabaaz:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  jwt:
    # 256-bit secret. Override in every environment (JWT_SECRET).
    secret: ${JWT_SECRET:addabaaz-dev-only-secret-please-replace-with-32-bytes-min}
    issuer: addabaaz-api
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  captcha:
    ttl: 5m
    length: 5
  bootstrap:
    admin:
      # Creates the first administrator if that email does not exist yet.
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@addabaaz.in}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
      full-name: ${BOOTSTRAP_ADMIN_NAME:ADDABAAZ Admin}

logging:
  level:
    in.addabaaz: INFO
    org.hibernate.SQL: WARN
